# Development profile: in-memory H2 DB and safe mail settings
spring.datasource.url=jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Defer SQL data script execution until JPA has created the schema
spring.jpa.defer-datasource-initialization=true

# Enable Spring SQL initialization for dev and point to H2-compatible seed file
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-dev.sql

# Enable H2 console for local debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Use simple mail settings for development (no external SMTP)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.test-connection=false

# Dev friendly logging
logging.level.org.springframework=INFO
logging.level.com.icosiam.cms=DEBUG

# Allow bean overriding in development to handle duplicate/legacy classes
spring.main.allow-bean-definition-overriding=true
