# Logging
logging.level.org.confcms.cms=INFO
# DEBUG here would log verbose auth internals to whatever this deployment's log
# aggregation is, right alongside the first-run admin password (logged once, in
# the clear, by design -- see FirstRunAdminInitializer) -- keep it at INFO/WARN
# in the default profile. Set it to DEBUG locally (application-dev.properties or
# a command-line override) when actually debugging authentication.
logging.level.org.springframework.security=WARN
