# Default (production-shaped) profile: real MySQL datasource, Hibernate-managed
# schema, first-run generated admin credential. No profile is force-activated
# here -- this file *is* the default. For local development against an
# in-memory H2 database with seeded sample data instead, opt in explicitly:
#   SPRING_PROFILES_ACTIVE=dev ./gradlew bootRun
# (Previously this file set spring.profiles.active=dev unconditionally, which
# meant a plain `./gradlew bootRun` always booted the dev profile -- including
# its static seeded admin account -- and the generated-admin-password flow
# below never actually ran by default.)

# Application
spring.application.name=conference-cms

# A logged-in user with no activity for 30 minutes is treated as logged out -- their next
# request after that is redirected to the login page (see SecurityConfig's
# invalidSessionUrl) rather than silently relying on Tomcat's own implicit default, which
# happened to already be 30m but was never an explicit, documented choice here.
server.servlet.session.timeout=30m

# Database (Externalized - using local MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/brain_boost?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
# NOTE: ddl-auto=update does not drop columns. When deploying the multi-auth
# feature (2026-09-21), run manually against production:
#   ALTER TABLE users DROP COLUMN provider, DROP COLUMN provider_id;
#   ALTER TABLE users ADD COLUMN orcid_id VARCHAR(255);
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Required: base64-encoded 32-byte AES-256 key used to encrypt Stripe/PayPal secret
# columns on conference_payment_configs at rest. Generate with:
#   openssl rand -base64 32
# There is no default -- the app refuses to start without it, since a payment
# secret written without this key would be either unencrypted or unrecoverable.
app.secrets.encryption-key=${PAYMENT_SECRETS_KEY}

# Spring Boot's default sql.init.mode is "never" for a non-embedded datasource, so
# without this data.sql would silently never run against MySQL. defer-datasource-
# initialization delays it until after Hibernate has created the schema (ddl-auto=update
# above), matching how application-dev.properties already runs data-dev.sql against H2.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# File Upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.storage.location=uploads

# Floor delay (ms) padding POST /auth/magic/request's unknown-email response time, to close
# a timing side-channel against the DB insert the known-email branch pays for and the
# unknown-email branch otherwise wouldn't. Default (30ms) is a starting guess, not measured
# against this deployment's real DB -- recalibrate against the production DB's own observed
# p50/p75 MagicLink insert latency rather than trusting this number as-is.
app.auth.magic-link.unknown-email-delay-millis=30

# Thymeleaf
spring.thymeleaf.cache=false

# Email (Configure SMTP for production)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

