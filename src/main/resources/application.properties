#configuration profile: development

# Default active profile for local development
spring.profiles.active=dev


# Application
spring.application.name=conference-cms

# Database (Externalized - using local MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/brain_boost?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
# NOTE: ddl-auto=update does not drop columns. When deploying the multi-auth
# feature (2026-09-21), run manually against production:
#   ALTER TABLE users DROP COLUMN provider, DROP COLUMN provider_id;
#   ALTER TABLE users ADD COLUMN orcid_id VARCHAR(255);
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# File Upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.storage.location=uploads

# Thymeleaf
spring.thymeleaf.cache=false

# Email (Configure SMTP for production)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

