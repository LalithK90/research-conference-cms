<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin_layout :: head('Dashboard')}"></head>

<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Conference CMS</a>
            <a class="btn btn-outline-light" href="/logout">Logout</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div th:if="${param.registered}" class="alert alert-success">
            Registration successful.
        </div>

        <div th:if="${rejectedRegistration}" class="alert alert-danger">
            Your bank slip was rejected: <span th:text="${rejectedRegistration.rejectionReason}"></span>.
            <a th:href="@{/registration/{id}/reupload-slip(id=${rejectedRegistration.id})}">Upload a corrected slip</a>
        </div>

        <div th:if="${passwordPromptPending}" class="alert alert-warning d-flex justify-content-between align-items-center">
            <span>You're using a temporary/passwordless login.</span>
            <span>
                <a th:href="@{/auth/forgot-password}" class="btn btn-sm btn-primary">Set a password now</a>
                <form method="post" th:action="@{/account/dismiss-password-prompt}" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-outline-secondary">Skip for now</button>
                </form>
            </span>
        </div>

        <h2>Welcome, <span th:text="${user.fullName}"></span></h2>
        <p class="text-muted" th:text="${user.role}"></p>
        <a th:href="@{/account}"><i class="fa-solid fa-gear me-1"></i>Account Settings</a>
        <a th:if="${user.role.name() == 'AUTHOR'}" th:href="@{/author/submissions}" class="ms-3">
            <i class="fa-solid fa-file-lines me-1"></i>My Submissions
        </a>
        <a th:if="${user.role.name() == 'REVIEWER'}" th:href="@{/review/ui}" class="ms-3">
            <i class="fa-solid fa-clipboard-list me-1"></i>My Review Assignments
        </a>
        <a th:if="${user.role.name() == 'REVIEWER'}" th:href="@{/review/ui/bidding}" class="ms-3">
            <i class="fa-solid fa-hand-point-up me-1"></i>Bid on Papers
        </a>
        <a th:if="${user.role.name() == 'REVIEWER'}" th:href="@{/review/ui/conflicts}" class="ms-3">
            <i class="fa-solid fa-user-shield me-1"></i>Declare Conflicts of Interest
        </a>
    </div>

    <script th:replace="~{fragments/admin_layout :: scripts}"></script>
</body>

</html>
