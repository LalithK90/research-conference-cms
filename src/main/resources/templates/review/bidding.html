<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin_layout :: head('Bid on Papers')}"></head>

<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/dashboard"><i class="fa-solid fa-hand-point-up me-2"></i>Bid on Papers</a>
            <a class="btn btn-outline-light btn-sm" href="/dashboard">
                <i class="fa-solid fa-arrow-left me-1"></i>Back to Dashboard
            </a>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="mb-1">Bid on Papers</h2>
        <p class="text-muted">
            Signal your interest in reviewing a submission before reviewers are assigned. This
            doesn't guarantee assignment -- the chair/admin still decides.
        </p>

        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="card mb-4" th:each="p : ${papers}">
            <div class="card-body">
                <h5 class="card-title" th:text="${p.title}"></h5>
                <p class="text-muted mb-2" th:text="'Track: ' + ${p.track}"></p>
                <p th:text="${p.abstractText}"></p>

                <form method="post" th:action="@{'/review/ui/bidding/' + ${p.paperId}}" class="d-flex align-items-center gap-2">
                    <select name="bidType" class="form-select w-auto">
                        <option th:each="bt : ${bidTypes}" th:value="${bt}" th:text="${bt}"
                                th:selected="${bt == p.currentBid}"></option>
                    </select>
                    <button type="submit" class="btn btn-sm btn-brand-primary">
                        <span th:if="${p.currentBid == null}">Submit Bid</span>
                        <span th:unless="${p.currentBid == null}">Update Bid</span>
                    </button>
                    <span th:if="${p.currentBid != null}" class="badge bg-secondary" th:text="'Current: ' + ${p.currentBid}"></span>
                </form>
            </div>
        </div>

        <p th:if="${#lists.isEmpty(papers)}" class="text-muted">No papers are open for bidding right now.</p>
    </div>

    <script th:replace="~{fragments/admin_layout :: scripts}"></script>
</body>

</html>
