<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>My Submissions - Conference CMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Conference CMS</a>
            <a class="btn btn-outline-light" href="/logout">Logout</a>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>My Submissions</h2>
        <a th:href="@{/dashboard}">Back to Dashboard</a>

        <div th:if="${#lists.isEmpty(papers)}" class="alert alert-info mt-3">
            You have not submitted any papers yet.
        </div>

        <table class="table table-bordered bg-white mt-3" th:unless="${#lists.isEmpty(papers)}">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Conference</th>
                    <th>Status</th>
                    <th>Latest Version</th>
                    <th>Registration / Payment</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="paper : ${papers}">
                    <td th:text="${paper.title}"></td>
                    <td th:text="${paper.conference.title}"></td>
                    <td th:text="${paper.status}"></td>
                    <td>
                        <span th:if="${!#lists.isEmpty(paper.versions)}"
                              th:text="'v' + ${paper.versions.get(paper.versions.size() - 1).versionNumber}"></span>
                        <span th:if="${#lists.isEmpty(paper.versions)}">-</span>
                    </td>
                    <td>
                        <span th:with="reg=${registrationsByConference.get(paper.conference.id)}">
                            <span th:if="${reg != null}" th:text="${reg.paymentStatus}"></span>
                            <span th:if="${reg == null}" class="text-muted">Not registered</span>
                        </span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
