<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin_layout :: head('Something Went Wrong')}"></head>

<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-7">
                <div class="card shadow">
                    <div class="card-body p-5 text-center">
                        <i class="fa-solid fa-triangle-exclamation text-warning mb-3" style="font-size: 3rem;"></i>
                        <h2 class="mb-3">Something Went Wrong</h2>
                        <p class="text-muted" th:if="${error}" th:text="${error}"></p>
                        <p class="text-muted" th:unless="${error}">
                            An unexpected error occurred. Please try again, or go back to the dashboard.
                        </p>
                        <a href="/dashboard" class="btn btn-brand-primary mt-3">
                            <i class="fa-solid fa-house me-1"></i>Back to Dashboard
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:replace="~{fragments/admin_layout :: scripts}"></script>
</body>

</html>
