<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin_layout :: head('Account Settings')}"></head>

<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Conference CMS</a>
            <a class="btn btn-outline-light" href="/logout">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <div th:if="${passwordPromptPending}" class="alert alert-warning d-flex justify-content-between align-items-center">
                            <span>You're using a temporary/passwordless login.</span>
                            <span>
                                <a th:href="@{/auth/forgot-password}" class="btn btn-sm btn-brand-primary">Set a password now</a>
                                <form method="post" th:action="@{/account/dismiss-password-prompt}" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-outline-secondary">Skip for now</button>
                                </form>
                            </span>
                        </div>

                        <h2 class="mb-4">Account Settings</h2>

                        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                        <p>Signed in as <strong th:text="${user.email}"></strong></p>

                        <h4 class="mt-4">Connected Accounts</h4>
                        <ul class="list-group mb-4">
                            <li class="list-group-item d-flex justify-content-between align-items-center"
                                th:each="identity : ${identities}">
                                <span>
                                    <span th:text="${identity.provider}"></span>
                                    <span class="text-muted small" th:if="${identity.linkedAt}"
                                          th:text="' linked ' + ${identity.linkedAt}"></span>
                                </span>
                                <form method="post"
                                      th:action="@{'/account/identities/' + ${identity.provider} + '/unlink'}">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        <i class="fa-solid fa-link-slash me-1"></i>Unlink
                                    </button>
                                </form>
                            </li>
                            <li class="list-group-item text-muted" th:if="${#lists.isEmpty(identities)}">
                                No connected accounts yet.
                            </li>
                        </ul>

                        <div class="d-grid gap-2">
                            <a th:href="@{/oauth2/authorization/google}" class="btn btn-outline-danger">Connect Google</a>
                            <a th:href="@{/oauth2/authorization/orcid}" class="btn btn-outline-success">Connect ORCID</a>
                            <a th:href="@{/auth/forgot-password}" class="btn btn-outline-primary">Set / change password</a>
                        </div>

                        <div class="text-center mt-4">
                            <a href="/">Back to Home</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:replace="~{fragments/admin_layout :: scripts}"></script>
</body>

</html>
