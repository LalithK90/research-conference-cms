<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="shareButtons(title)" class="d-flex align-items-center gap-2 flex-wrap my-4">
  <span class="small fw-semibold text-muted me-1">Share:</span>
  <a class="btn btn-sm btn-outline-secondary" target="_blank" rel="noopener" title="Share on Facebook"
     th:href="'https://www.facebook.com/sharer/sharer.php?u=' + ${#uris.escapeQueryParam(canonicalUrl)}">
    <i class="fa-brands fa-facebook-f"></i>
  </a>
  <a class="btn btn-sm btn-outline-secondary" target="_blank" rel="noopener" title="Share on X"
     th:href="'https://twitter.com/intent/tweet?url=' + ${#uris.escapeQueryParam(canonicalUrl)} + '&amp;text=' + ${#uris.escapeQueryParam(title)}">
    <i class="fa-brands fa-x-twitter"></i>
  </a>
  <a class="btn btn-sm btn-outline-secondary" target="_blank" rel="noopener" title="Share on LinkedIn"
     th:href="'https://www.linkedin.com/sharing/share-offsite/?url=' + ${#uris.escapeQueryParam(canonicalUrl)}">
    <i class="fa-brands fa-linkedin-in"></i>
  </a>
  <a class="btn btn-sm btn-outline-secondary" target="_blank" rel="noopener" title="Share on WhatsApp"
     th:href="'https://api.whatsapp.com/send?text=' + ${#uris.escapeQueryParam(title + ' ' + canonicalUrl)}">
    <i class="fa-brands fa-whatsapp"></i>
  </a>
  <a class="btn btn-sm btn-outline-secondary" target="_blank" rel="noopener" title="Share on LINE"
     th:href="'https://social-plugins.line.me/lineit/share?url=' + ${#uris.escapeQueryParam(canonicalUrl)} + '&amp;text=' + ${#uris.escapeQueryParam(title)}">
    <i class="fa-brands fa-line"></i>
  </a>
  <button type="button" class="btn btn-sm btn-outline-secondary copy-link-btn" title="Copy link"
          th:attr="data-url=${canonicalUrl}">
    <i class="fa fa-link"></i>
  </button>
</div>
<script th:fragment="shareButtonsScript">
  document.querySelectorAll('.copy-link-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      navigator.clipboard.writeText(btn.dataset.url).then(function () {
        var icon = btn.querySelector('i');
        icon.className = 'fa fa-check';
        setTimeout(function () { icon.className = 'fa fa-link'; }, 1500);
      });
    });
  });
</script>
</body>
</html>
