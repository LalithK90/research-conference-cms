<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Conference CMS'">Conference CMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>

<body>
    <nav th:fragment="nav" class="navbar navbar-dark bg-dark navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/admin/dashboard"><i class="fa-solid fa-gauge-high me-2"></i>CMS Admin</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="adminNavbarNav">
                <div class="navbar-nav me-auto">
                    <a class="btn btn-outline-light btn-sm me-2 mt-1" href="/admin/conference/list">
                        <i class="fa-solid fa-calendar-days me-1"></i>Conferences
                    </a>
                    <a class="btn btn-outline-light btn-sm me-2 mt-1" href="/admin/registrations">
                        <i class="fa-solid fa-money-check-dollar me-1"></i>Registrations
                    </a>
                    <a class="btn btn-outline-light btn-sm me-2 mt-1" href="/admin/decisions/ui">
                        <i class="fa-solid fa-clipboard-check me-1"></i>Decisions
                    </a>
                    <a class="btn btn-outline-light btn-sm me-2 mt-1" href="/admin/access-logs">
                        <i class="fa-solid fa-shield-halved me-1"></i>Access Logs
                    </a>
                </div>
                <a class="btn btn-outline-light btn-sm mt-1" href="/logout">
                    <i class="fa-solid fa-right-from-bracket me-1"></i>Logout
                </a>
            </div>
        </div>
    </nav>

    <script th:fragment="scripts" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
