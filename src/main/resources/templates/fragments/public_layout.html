<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - ' + ${conference != null ? conference.title : 'Conference'}">Conference</title>
    <link rel="icon" th:href="${branding != null and branding.faviconUrl != null} ? ${branding.faviconUrl} : '/images/favicon/favicon.ico'">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
    <link href="/css/theme.css" rel="stylesheet">
    <style th:if="${branding != null and (branding.primaryColor != null or branding.accentColor != null)}" th:inline="text">
        :root {
            --brand-primary: [[${branding.primaryColor ?: '#06690f'}]];
            --brand-primary-dark: [[${branding.primaryColorDark ?: '#05540c'}]];
            --brand-accent: [[${branding.accentColor ?: '#e91e63'}]];
        }
    </style>
</head>

<body>
    <!-- th:block lets this fragment emit two sibling top-level elements (the background div
         plus the actual <nav>) from the one existing "nav" fragment reference every public
         page already has as the first line inside <body> -- no per-page template changes
         needed to add the animated background. -->
    <th:block th:fragment="nav">
    <!-- Animated "magnetic field" particle background (tsParticles), fixed behind all page
         content via z-index -- public pages only, never the admin/review/auth areas. -->
    <div id="tsparticles-bg"></div>

    <nav class="navbar navbar-expand-lg public-navbar"
         th:with="pcid=${pastConferenceId}">
        <div class="container">
            <a class="navbar-brand" href="/">
                <img th:if="${branding != null and branding.logoUrl != null}" th:src="${branding.logoUrl}"
                     alt="Logo" class="navbar-brand-logo">
                <span th:text="${conference != null ? conference.title : 'Conference'}">Conference</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">About</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" th:href="${pcid != null ? '/past-conferences/' + pcid + '/about' : '/about'}">About</a></li>
                            <li><a class="dropdown-item" th:href="${pcid != null ? '/past-conferences/' + pcid + '/committee' : '/committee'}">Committee</a></li>
                            <li><a class="dropdown-item" th:href="${pcid != null ? '/past-conferences/' + pcid + '/speakers' : '/speakers'}">Speakers</a></li>
                            <li><a class="dropdown-item" th:href="${pcid != null ? '/past-conferences/' + pcid + '/sponsors' : '/sponsors'}">Sponsors</a></li>
                        </ul>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Event</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" th:href="${pcid != null ? '/past-conferences/' + pcid + '/schedule' : '/schedule'}">Schedule</a></li>
                            <li><a class="dropdown-item" href="/call-for-papers">Call for Papers</a></li>
                            <li><a class="dropdown-item" href="/venue">Venue &amp; Travel</a></li>
                        </ul>
                    </li>

                    <li class="nav-item"><a class="nav-link" href="/past-conferences">Past Conferences</a></li>
                    <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
                    <li class="nav-item"><a class="nav-link" href="/register">Registration</a></li>

                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" href="/dashboard">Dashboard</a>
                    </li>
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" href="/login">Login</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <form method="post" th:action="@{/logout}" class="d-inline">
                            <button type="submit" class="btn btn-link nav-link" style="border:none;">Logout</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    </th:block>

    <footer th:fragment="footer" class="public-footer text-center py-4">
        <p>&copy; <span th:text="${#calendars.format(#calendars.createNow(), 'yyyy')}">2026</span>
            <span th:text="${conference != null ? conference.title : 'Conference'}">Conference</span>. All rights reserved.</p>
    </footer>

    <th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
    <script>
        // Magnetic-field particle background: dots drift slowly and link with thin lines,
        // pulled toward the cursor on hover. Colors adapted from the original dark demo
        // (lalithk90.github.io/background-lab/01-particles.html) to this site's light theme
        // and brand green, instead of the demo's dark background + blue particles.
        (function () {
            var el = document.getElementById('tsparticles-bg');
            if (!el || typeof tsParticles === 'undefined') return;
            var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            tsParticles.load({
                id: 'tsparticles-bg',
                options: {
                    fullScreen: { enable: false },
                    background: { color: 'transparent' },
                    fpsLimit: 60,
                    particles: {
                        number: { value: 60, density: { enable: true, area: 900 } },
                        color: { value: '#06690f' },
                        links: { enable: true, distance: 120, color: '#06690f', opacity: 0.18, width: 1 },
                        opacity: { value: 0.35 },
                        move: { enable: !reducedMotion, speed: 1 },
                        size: { value: { min: 1, max: 2 } }
                    },
                    interactivity: {
                        events: { onHover: { enable: true, mode: 'attract' } },
                        modes: { attract: { distance: 250, duration: 0.4, factor: 5, speed: 1.5 } }
                    },
                    detectRetina: true
                }
            });
        })();
    </script>
    </th:block>
</body>

</html>
