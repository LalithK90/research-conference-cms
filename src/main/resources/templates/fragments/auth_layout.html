<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Conference CMS'">Conference CMS</title>
    <link rel="icon" th:href="${branding != null and branding.faviconUrl != null} ? ${branding.faviconUrl} : '/images/favicon/favicon.ico'">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
    <link href="/css/theme.css" rel="stylesheet">
    <style th:if="${branding != null and (branding.primaryColor != null or branding.accentColor != null)}" th:inline="text">
        :root {
            --brand-primary: [[${branding.primaryColor ?: '#06690f'}]];
            --brand-primary-dark: [[${branding.primaryColorDark ?: '#05540c'}]];
            --brand-accent: [[${branding.accentColor ?: '#e91e63'}]];
        }
    </style>
</head>

<body>
    <script th:fragment="scripts" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
