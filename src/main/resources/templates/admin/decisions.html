<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Admin - Decision Suggestions</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { padding: 8px; border: 1px solid #ddd; }
        th { background: #f4f4f4; }
        .actions form { display: inline-block; margin-right: 4px; }
    </style>
</head>
<body>
<h1>Decision Suggestions</h1>
<p>Accept threshold: 3.5 | Reject threshold: 2.5</p>
<table>
    <thead>
        <tr>
            <th>Paper ID</th>
            <th>Title</th>
            <th>Avg Score</th>
            <th>Suggestion</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
    <tr th:each="s : ${suggestions}">
        <td th:text="${s.paperId}"></td>
        <td><a th:href="@{'/admin/decisions/ui/paper/' + ${s.paperId}}" th:text="${s.title}"></a></td>
        <td th:text="${#numbers.formatDecimal(s.averageScore, 1, 'POINT', 1, 'POINT')}"></td>
        <td th:text="${s.suggestion}"></td>
        <td class="actions">
            <form th:action="@{'/admin/decisions/' + ${s.paperId} + '/apply?decision=ACCEPT'}" method="post">
                <button type="submit">Accept</button>
            </form>
            <form th:action="@{'/admin/decisions/' + ${s.paperId} + '/apply?decision=REJECT'}" method="post">
                <button type="submit">Reject</button>
            </form>
            <form th:action="@{'/admin/decisions/' + ${s.paperId} + '/apply?decision=BORDERLINE'}" method="post">
                <button type="submit">Borderline</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
