<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin_layout :: head('Decision Suggestions')}"></head>

<body>
    <nav th:replace="~{fragments/admin_layout :: nav}"></nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Decision Suggestions</h2>
            <a th:href="@{/admin/decisions/ui/camera-ready}" class="btn btn-outline-primary">
                <i class="fa-solid fa-file-circle-check me-1"></i>View Camera-Ready Status
            </a>
        </div>
        <p class="text-muted">Accept threshold: 3.5 | Reject threshold: 2.5</p>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Paper ID</th>
                    <th>Title</th>
                    <th>Avg Score</th>
                    <th>Suggestion</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="s : ${suggestions}">
                    <td th:text="${s.paperId}"></td>
                    <td><a th:href="@{'/admin/decisions/ui/paper/' + ${s.paperId}}" th:text="${s.title}"></a></td>
                    <td th:text="${#numbers.formatDecimal(s.averageScore, 1, 'POINT', 1, 'POINT')}"></td>
                    <td th:text="${s.suggestion}"></td>
                    <td>
                        <form th:action="@{'/admin/decisions/' + ${s.paperId} + '/apply?decision=ACCEPT'}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-success">Accept</button>
                        </form>
                        <form th:action="@{'/admin/decisions/' + ${s.paperId} + '/apply?decision=REJECT'}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-danger">Reject</button>
                        </form>
                        <form th:action="@{'/admin/decisions/' + ${s.paperId} + '/apply?decision=BORDERLINE'}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-secondary">Borderline</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script th:replace="~{fragments/admin_layout :: scripts}"></script>
</body>

</html>
