<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin_layout :: head('Users')}"></head>

<body>
    <nav th:replace="~{fragments/admin_layout :: nav}"></nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Users</h2>
            <a th:href="@{/admin/users/new}" class="btn btn-success">
                <i class="fa-solid fa-user-plus me-1"></i>New User
            </a>
        </div>

        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Email</th>
                    <th>Name</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="u : ${users}">
                    <td th:text="${u.email}"></td>
                    <td th:text="${u.fullName}"></td>
                    <td>
                        <form method="post" th:action="@{'/admin/users/' + ${u.id} + '/role'}" class="d-flex gap-2">
                            <select name="role" class="form-select form-select-sm w-auto">
                                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${r == u.role}"></option>
                            </select>
                            <button type="submit" class="btn btn-sm btn-outline-primary">Save</button>
                        </form>
                    </td>
                    <td>
                        <span th:if="${u.enabled}" class="badge bg-success">Enabled</span>
                        <span th:unless="${u.enabled}" class="badge bg-secondary">Disabled</span>
                    </td>
                    <td>
                        <form th:if="${u.enabled}" method="post" th:action="@{'/admin/users/' + ${u.id} + '/enabled'}" class="d-inline">
                            <input type="hidden" name="enabled" value="false">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Disable</button>
                        </form>
                        <form th:unless="${u.enabled}" method="post" th:action="@{'/admin/users/' + ${u.id} + '/enabled'}" class="d-inline">
                            <input type="hidden" name="enabled" value="true">
                            <button type="submit" class="btn btn-sm btn-outline-success">Enable</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="5" class="text-muted">No users yet.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script th:replace="~{fragments/admin_layout :: scripts}"></script>
</body>

</html>
