<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Create Conference</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .payment-section {
            display: none;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/admin/dashboard">CMS Admin</a>
            <a class="btn btn-outline-light" href="/logout">Logout</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">Create New Conference</h3>
            </div>
            <div class="card-body">
                <form th:action="@{/admin/conference/save}" th:object="${conferenceForm}" method="post">

                    <!-- Basic Details -->
                    <h5 class="mb-3">Conference Details</h5>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Conference Title</label>
                            <input type="text" class="form-control" th:field="*{title}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Venue</label>
                            <input type="text" class="form-control" th:field="*{venue}" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Start Date</label>
                            <input type="date" class="form-control" th:field="*{startDate}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">End Date</label>
                            <input type="date" class="form-control" th:field="*{endDate}" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Contact Email</label>
                            <input type="email" class="form-control" th:field="*{contactEmail}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Logo URL</label>
                            <input type="text" class="form-control" th:field="*{logoUrl}">
                        </div>
                    </div>

                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" th:field="*{active}">
                        <label class="form-check-label">Set as Active Conference</label>
                    </div>

                    <hr>

                    <!-- Payment Configuration -->
                    <h5 class="mb-3">Payment Configuration</h5>
                    <p class="text-muted small">Select a payment provider for registration fees. Refunds are handled
                        manually.</p>

                    <div class="mb-3">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" th:field="*{paymentProvider}" value="FREE"
                                id="payFree" onclick="togglePaymentFields()">
                            <label class="form-check-label" for="payFree">Free (No Payment)</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" th:field="*{paymentProvider}" value="STRIPE"
                                id="payStripe" onclick="togglePaymentFields()">
                            <label class="form-check-label" for="payStripe">Stripe</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" th:field="*{paymentProvider}" value="PAYPAL"
                                id="payPaypal" onclick="togglePaymentFields()">
                            <label class="form-check-label" for="payPaypal">PayPal</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" th:field="*{paymentProvider}"
                                value="LOCAL_BANK" id="payBank" onclick="togglePaymentFields()">
                            <label class="form-check-label" for="payBank">Local Bank Transfer</label>
                        </div>
                    </div>

                    <!-- Stripe Fields -->
                    <div id="stripe-section" class="payment-section card bg-light mb-3">
                        <div class="card-body">
                            <h6>Stripe Configuration</h6>
                            <div class="mb-2">
                                <label class="form-label">Publishable Key</label>
                                <input type="text" class="form-control" th:field="*{stripePublishableKey}">
                            </div>
                            <div class="mb-2">
                                <label class="form-label">Secret Key</label>
                                <input type="text" class="form-control" th:field="*{stripeSecretKey}">
                            </div>
                        </div>
                    </div>

                    <!-- PayPal Fields -->
                    <div id="paypal-section" class="payment-section card bg-light mb-3">
                        <div class="card-body">
                            <h6>PayPal Configuration</h6>
                            <div class="mb-2">
                                <label class="form-label">Client ID</label>
                                <input type="text" class="form-control" th:field="*{paypalClientId}">
                            </div>
                            <div class="mb-2">
                                <label class="form-label">Client Secret</label>
                                <input type="text" class="form-control" th:field="*{paypalClientSecret}">
                            </div>
                        </div>
                    </div>

                    <!-- Bank Fields -->
                    <div id="bank-section" class="payment-section card bg-light mb-3">
                        <div class="card-body">
                            <h6>Local Bank Transfer Instructions</h6>
                            <div class="mb-2">
                                <label class="form-label">Bank Details / API Endpoint</label>
                                <textarea class="form-control" rows="3" th:field="*{bankDetails}"
                                    placeholder="Enter bank account details or API URL for verification..."></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success btn-lg">Create Conference</button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <script>
        function togglePaymentFields () {
            // Hide all first
            document.querySelectorAll('.payment-section').forEach(el => el.style.display = 'none');

            // Show selected
            if (document.getElementById('payStripe').checked) {
                document.getElementById('stripe-section').style.display = 'block';
            } else if (document.getElementById('payPaypal').checked) {
                document.getElementById('paypal-section').style.display = 'block';
            } else if (document.getElementById('payBank').checked) {
                document.getElementById('bank-section').style.display = 'block';
            }
        }

        // Run on load to set initial state
        window.onload = togglePaymentFields;
    </script>
</body>

</html>
