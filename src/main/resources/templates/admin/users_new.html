<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin_layout :: head('Create User')}"></head>

<body>
    <nav th:replace="~{fragments/admin_layout :: nav}"></nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h2 class="mb-4">Create User</h2>

                <div th:if="${param.created}" class="alert alert-success">
                    User created. They can sign in via Google or a magic link (no password set).
                </div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <form method="post" th:action="@{/admin/users/new}">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" name="fullName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Role</label>
                        <select name="role" class="form-select" required>
                            <option value="AUTHOR">Author</option>
                            <option value="REVIEWER">Reviewer</option>
                        </select>
                        <div class="form-text">Admin accounts can't be created without a password here.</div>
                    </div>
                    <button type="submit" class="btn btn-primary">Create User</button>
                </form>
            </div>
        </div>
    </div>

    <script th:replace="~{fragments/admin_layout :: scripts}"></script>
</body>

</html>
