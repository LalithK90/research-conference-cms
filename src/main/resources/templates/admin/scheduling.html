<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin_layout :: head('Program Builder')}"></head>

<body>
    <nav th:replace="~{fragments/admin_layout :: nav}"></nav>

    <div class="container mt-4">
        <h2 th:text="'Program Builder - ' + ${conference.title}">Program Builder</h2>

        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="row g-4 mb-4">
            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">Rooms</h5>
                        <table class="table table-sm">
                            <thead>
                                <tr><th>Name</th><th>Capacity</th><th>Location</th></tr>
                            </thead>
                            <tbody>
                                <tr th:each="r : ${rooms}">
                                    <td th:text="${r.name}"></td>
                                    <td th:text="${r.capacity}"></td>
                                    <td th:text="${r.location}"></td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(rooms)}">
                                    <td colspan="3" class="text-muted">No rooms yet.</td>
                                </tr>
                            </tbody>
                        </table>
                        <form method="post" th:action="@{'/admin/conference/' + ${conference.id} + '/scheduling/rooms'}" class="row g-2">
                            <div class="col-4">
                                <input type="text" class="form-control form-control-sm" name="name" placeholder="Room name" required>
                            </div>
                            <div class="col-3">
                                <input type="number" class="form-control form-control-sm" name="capacity" placeholder="Capacity">
                            </div>
                            <div class="col-3">
                                <input type="text" class="form-control form-control-sm" name="location" placeholder="Location">
                            </div>
                            <div class="col-2">
                                <button type="submit" class="btn btn-sm btn-success w-100">Add</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">New Session</h5>
                        <form method="post" th:action="@{'/admin/conference/' + ${conference.id} + '/scheduling/sessions'}">
                            <div class="mb-2">
                                <input type="text" class="form-control form-control-sm" name="title" placeholder="Session title" required>
                            </div>
                            <div class="mb-2">
                                <textarea class="form-control form-control-sm" name="description" placeholder="Description" rows="2"></textarea>
                            </div>
                            <div class="row g-2 mb-2">
                                <div class="col-6">
                                    <label class="form-label small">Start</label>
                                    <input type="datetime-local" class="form-control form-control-sm" name="startTime" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label small">End</label>
                                    <input type="datetime-local" class="form-control form-control-sm" name="endTime" required>
                                </div>
                            </div>
                            <div class="mb-2">
                                <select class="form-select form-select-sm" name="roomId">
                                    <option value="">-- no room --</option>
                                    <option th:each="r : ${rooms}" th:value="${r.id}" th:text="${r.name}"></option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-sm btn-success">Add Session</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Sessions &amp; Presentations</h5>
                <div th:each="s : ${sessions}" class="border rounded p-3 mb-3">
                    <div class="d-flex justify-content-between">
                        <div>
                            <strong th:text="${s.title}"></strong>
                            <span class="text-muted small" th:text="' (' + ${s.startTime} + ' - ' + ${s.endTime} + ')'"></span>
                            <span class="badge bg-secondary" th:if="${s.room != null}" th:text="${s.room.name}"></span>
                        </div>
                    </div>
                    <table class="table table-sm mt-2">
                        <tbody>
                            <tr th:each="p : ${s.presentations}">
                                <td th:text="${p.paper.title}"></td>
                                <td th:text="${p.startTime} + ' - ' + ${p.endTime}"></td>
                                <td>
                                    <form method="post"
                                          th:action="@{'/admin/conference/' + ${conference.id} + '/scheduling/presentations/' + ${p.id} + '/remove'}">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">Remove</button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(s.presentations)}">
                                <td colspan="3" class="text-muted">No papers scheduled in this session yet.</td>
                            </tr>
                        </tbody>
                    </table>

                    <form method="post" th:action="@{'/admin/conference/' + ${conference.id} + '/scheduling/presentations'}" class="row g-2">
                        <input type="hidden" name="sessionId" th:value="${s.id}">
                        <div class="col-4">
                            <select class="form-select form-select-sm" name="paperId" required>
                                <option value="" disabled selected>Choose a paper</option>
                                <option th:each="paper : ${schedulablePapers}" th:value="${paper.id}" th:text="${paper.title}"></option>
                            </select>
                        </div>
                        <div class="col-3">
                            <input type="datetime-local" class="form-control form-control-sm" name="startTime" required>
                        </div>
                        <div class="col-3">
                            <input type="datetime-local" class="form-control form-control-sm" name="endTime" required>
                        </div>
                        <div class="col-2">
                            <button type="submit" class="btn btn-sm btn-primary w-100">Schedule</button>
                        </div>
                    </form>
                </div>
                <p th:if="${#lists.isEmpty(sessions)}" class="text-muted">No sessions yet -- add one above.</p>
            </div>
        </div>
    </div>

    <script th:replace="~{fragments/admin_layout :: scripts}"></script>
</body>

</html>
