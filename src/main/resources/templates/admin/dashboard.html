<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin_layout :: head('Admin Dashboard')}"></head>

<body>
    <nav th:replace="~{fragments/admin_layout :: nav}"></nav>

    <div class="container mt-4" th:if="${passwordPromptPending}">
        <div class="alert alert-warning d-flex justify-content-between align-items-center">
            <span>You're using a temporary/passwordless login.</span>
            <span>
                <a th:href="@{/auth/forgot-password}" class="btn btn-sm btn-primary">Set a password now</a>
                <form method="post" th:action="@{/account/dismiss-password-prompt}" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-outline-secondary">Skip for now</button>
                </form>
            </span>
        </div>
    </div>

    <div class="container mt-4">
        <h2>Submissions</h2>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Submitter</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="paper : ${papers}">
                    <td th:text="${paper.id}">1</td>
                    <td>
                        <span th:text="${paper.title}">Title</span>
                        <span th:if="${duplicateMatches.containsKey(paper.id)}"
                              class="badge bg-warning text-dark"
                              th:title="'Possible duplicate of: ' + ${duplicateMatches.get(paper.id).paper.title} + ' (v' + ${duplicateMatches.get(paper.id).versionNumber} + ')'">
                            &#9888; Possible duplicate
                        </span>
                    </td>
                    <td th:text="${paper.submitter.fullName}">Author</td>
                    <td>
                        <span class="badge bg-secondary" th:text="${paper.status}">SUBMITTED</span>
                    </td>
                    <td>
                        <a href="#" class="btn btn-sm btn-primary">View</a>
                        <a href="#" class="btn btn-sm btn-info">Assign Reviewer</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script th:replace="~{fragments/admin_layout :: scripts}"></script>
</body>

</html>
