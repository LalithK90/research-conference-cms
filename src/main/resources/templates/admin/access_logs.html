<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin_layout :: head('Access Logs')}"></head>

<body>
    <nav th:replace="~{fragments/admin_layout :: nav}"></nav>

    <div class="container mt-4">
        <h2>Access Logs (most recent 100)</h2>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Event</th>
                    <th>User</th>
                    <th>Timestamp</th>
                    <th>IP Address</th>
                    <th>Location</th>
                    <th>Paper</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="entry : ${logs}">
                    <td th:text="${entry.eventType}"></td>
                    <td th:text="${entry.user != null ? entry.user.email : (entry.requestedEmail != null ? entry.requestedEmail : '-')}"></td>
                    <td th:text="${entry.createdAt}"></td>
                    <td th:text="${entry.ipAddress}"></td>
                    <td th:text="${entry.resolvedLocation != null ? entry.resolvedLocation : '-'}"></td>
                    <td th:text="${entry.paperVersion != null ? (entry.paperVersion.paper.title + ' (v' + entry.paperVersion.versionNumber + ')') : '-'}"></td>
                </tr>
                <tr th:if="${logs.isEmpty()}">
                    <td colspan="6" class="text-muted">No access log entries yet.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script th:replace="~{fragments/admin_layout :: scripts}"></script>
</body>

</html>
