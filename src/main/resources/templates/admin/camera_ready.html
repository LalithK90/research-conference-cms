<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Camera-Ready Status</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { padding: 8px; border: 1px solid #ddd; }
        th { background: #f4f4f4; }
    </style>
</head>
<body>
<h1>Camera-Ready Status</h1>
<a th:href="@{/admin/decisions/ui}">Back to Decision Suggestions</a>

<div>
    <h2>Generate Proceedings</h2>
    <ul>
        <li th:each="c : ${conferences}">
            <span th:text="${c.title}"></span>
            &mdash;
            <a th:href="@{'/admin/decisions/proceedings/' + ${c.id} + '/pdf'}">Download Proceedings PDF</a>
            |
            <a th:href="@{'/admin/decisions/proceedings/' + ${c.id} + '/bibtex'}">Export BibTeX</a>
        </li>
    </ul>
</div>

<table>
    <thead>
        <tr><th>Paper ID</th><th>Title</th><th>Conference</th><th>Status</th><th>Camera-Ready</th></tr>
    </thead>
    <tbody>
    <tr th:each="p : ${papers}" th:with="cameraReadyVersions=${p.versions.?[cameraReady]}">
        <td th:text="${p.id}"></td>
        <td><a th:href="@{'/admin/decisions/ui/paper/' + ${p.id}}" th:text="${p.title}"></a></td>
        <td th:text="${p.conference.title}"></td>
        <td th:text="${p.status}"></td>
        <td>
            <span th:if="${!#lists.isEmpty(cameraReadyVersions)}"
                  th:text="'Submitted on ' + ${cameraReadyVersions[0].copyrightTransferAgreedAt}"></span>
            <span th:if="${#lists.isEmpty(cameraReadyVersions)}">Not yet submitted</span>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
