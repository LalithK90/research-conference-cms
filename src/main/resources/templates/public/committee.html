<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/public_layout :: head('Committee')}"></head>

<body>
    <nav th:replace="~{fragments/public_layout :: nav}"></nav>

    <div class="container my-5">
        <h1 class="text-center mb-5">Committee</h1>

        <div th:if="${#lists.isEmpty(committee)}" class="alert alert-info">
            Committee members will be announced soon.
        </div>
        <div class="people-list">
            <div class="people-row" th:each="member : ${committee}">
                <img th:if="${member.photoUrl}" th:src="${member.photoUrl}" th:alt="${member.user.fullName}" class="people-photo">
                <div th:unless="${member.photoUrl}" class="people-photo people-photo-placeholder"
                     th:text="${#strings.isEmpty(member.user.fullName) ? '?' : #strings.substring(member.user.fullName, 0, 1)}">N</div>
                <div class="people-info">
                    <h3 class="people-name" th:text="${member.user.fullName}">Name</h3>
                    <p class="people-role" th:text="${member.displayTitle ?: member.role.name()}">Role</p>
                    <p class="people-bio" th:if="${member.bio}" th:text="${member.bio}">Bio</p>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/public_layout :: footer}"></footer>
    <script th:replace="~{fragments/public_layout :: scripts}"></script>
</body>

</html>
