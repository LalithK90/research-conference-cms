<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Steering Committee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/" th:text="${conference.title}">Conference</a>
        </div>
    </nav>

    <div class="container my-5">
        <h1 class="text-center mb-5">Steering Committee</h1>

        <div class="row">
            <div class="col-md-6 mb-4" th:each="member : ${committee}">
                <div class="card h-100">
                    <div class="card-body">
                        <div class="d-flex align-items-center">
                            <img th:src="${member.imageUrl}" alt="Photo" class="rounded-circle me-3"
                                style="width: 100px; height: 100px; object-fit: cover;">
                            <div>
                                <h5 class="card-title" th:text="${member.name}">Name</h5>
                                <p class="text-muted" th:text="${member.role}">Role</p>
                            </div>
                        </div>
                        <p class="mt-3" th:text="${member.bio}">Bio</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4">
        <p>&copy; 2026 <span th:text="${conference.title}">Conference</span></p>
    </footer>
</body>

</html>
