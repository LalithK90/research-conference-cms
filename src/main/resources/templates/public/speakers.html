<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/public_layout :: head('Speakers')}"></head>

<body>
    <nav th:replace="~{fragments/public_layout :: nav}"></nav>

    <div class="container my-5">
        <h1 class="text-center mb-5">Speakers</h1>

        <h2 class="mb-4">Plenary Speakers</h2>
        <div th:if="${#lists.isEmpty(plenarySpeakers)}" class="alert alert-info">
            Plenary speakers will be announced soon.
        </div>
        <div class="row g-4 mb-5">
            <div class="col-md-4" th:each="speaker : ${plenarySpeakers}">
                <div class="speaker-tile">
                    <img th:if="${speaker.photoUrl}" th:src="${speaker.photoUrl}" th:alt="${speaker.fullName}" class="speaker-photo">
                    <div th:unless="${speaker.photoUrl}" class="speaker-photo speaker-photo-placeholder"
                         th:text="${#strings.isEmpty(speaker.fullName) ? '?' : #strings.substring(speaker.fullName, 0, 1)}">N</div>
                    <h5 class="speaker-name" th:text="${speaker.fullName}">Name</h5>
                    <p class="speaker-title" th:if="${speaker.title}" th:text="${speaker.title}">Title</p>
                    <p class="speaker-bio" th:if="${speaker.bio}" th:text="${speaker.bio}">Bio</p>
                </div>
            </div>
        </div>

        <h2 class="mb-4">Keynote Speakers</h2>
        <div th:if="${#lists.isEmpty(keynoteSpeakers)}" class="alert alert-info">
            Keynote speakers will be announced soon.
        </div>
        <div class="row g-4">
            <div class="col-md-4" th:each="speaker : ${keynoteSpeakers}">
                <div class="speaker-tile">
                    <img th:if="${speaker.photoUrl}" th:src="${speaker.photoUrl}" th:alt="${speaker.fullName}" class="speaker-photo">
                    <div th:unless="${speaker.photoUrl}" class="speaker-photo speaker-photo-placeholder"
                         th:text="${#strings.isEmpty(speaker.fullName) ? '?' : #strings.substring(speaker.fullName, 0, 1)}">N</div>
                    <h5 class="speaker-name" th:text="${speaker.fullName}">Name</h5>
                    <p class="speaker-title" th:if="${speaker.title}" th:text="${speaker.title}">Title</p>
                    <p class="speaker-bio" th:if="${speaker.bio}" th:text="${speaker.bio}">Bio</p>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/public_layout :: footer}"></footer>
    <script th:replace="~{fragments/public_layout :: scripts}"></script>
</body>

</html>
