<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/auth_layout :: head('Forgot Password')}"></head>

<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-4">
                            <i class="fa-solid fa-key me-2"></i>Forgot Password
                        </h2>

                        <div th:if="${submitted}" class="alert alert-success">
                            If an account exists for that email address, a reset link has been sent.
                        </div>

                        <form th:unless="${submitted}" method="post" th:action="@{/auth/forgot-password}">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" required autofocus>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
                        </form>

                        <div class="text-center mt-3">
                            <a th:href="@{/login}">Back to login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:replace="~{fragments/auth_layout :: scripts}"></script>
</body>

</html>
