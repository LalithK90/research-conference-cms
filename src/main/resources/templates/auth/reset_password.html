<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/auth_layout :: head('Reset Password')}"></head>

<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-4">
                            <i class="fa-solid fa-lock me-2"></i>Reset Password
                        </h2>

                        <div th:if="${error}">
                            <div class="alert alert-danger" th:text="${error}"></div>
                            <p class="text-center">
                                <a th:href="@{/auth/forgot-password}">Request a new reset link</a>
                            </p>
                        </div>

                        <form th:if="${token}" method="post" th:action="@{/auth/reset-password}">
                            <input type="hidden" name="token" th:value="${token}" />
                            <div class="mb-3">
                                <label for="password" class="form-label">New Password</label>
                                <input type="password" class="form-control" id="password" name="password" required minlength="8" autofocus>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Reset Password</button>
                        </form>

                        <div class="text-center mt-3">
                            <a th:href="@{/login}">Back to login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:replace="~{fragments/auth_layout :: scripts}"></script>
</body>

</html>
