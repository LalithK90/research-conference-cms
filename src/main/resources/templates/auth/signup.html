<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/auth_layout :: head('Create Account')}"></head>

<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-4">
                            <i class="fa-solid fa-user-plus me-2"></i>Create Account
                        </h2>

                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                        <form method="post" th:action="@{/auth/signup}">
                            <div class="mb-3">
                                <label for="fullName" class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="fullName" name="fullName"
                                    th:value="${fullName}" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email"
                                    th:value="${email}" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <button type="submit" class="btn btn-brand-primary w-100">Create Account</button>
                        </form>

                        <div class="text-center mt-3">
                            <a th:href="@{/login}">Back to Login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:replace="~{fragments/auth_layout :: scripts}"></script>
</body>

</html>
