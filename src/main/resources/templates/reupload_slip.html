<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin_layout :: head('Re-upload Bank Slip')}"></head>

<body>
    <nav th:replace="~{fragments/admin_layout :: nav}"></nav>

    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <h2 class="mb-4">Re-upload Bank Slip</h2>

                        <div class="alert alert-warning">
                            Your previous slip was rejected: <span th:text="${registration.rejectionReason}"></span>
                        </div>
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                        <form method="post"
                              th:action="@{/registration/{id}/reupload-slip(id=${registration.id})}"
                              enctype="multipart/form-data">
                            <div class="mb-3">
                                <label class="form-label">Corrected Bank Slip (PDF, JPEG, or PNG)</label>
                                <input type="file" class="form-control" name="bankSlip" accept=".pdf,.jpg,.jpeg,.png" required>
                            </div>
                            <button type="submit" class="btn btn-brand-primary w-100">Submit</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:replace="~{fragments/admin_layout :: scripts}"></script>
</body>

</html>
