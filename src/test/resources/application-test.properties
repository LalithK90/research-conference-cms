# Activated via @ActiveProfiles("test") on @SpringBootTest integration tests only.
# No Docker/Testcontainers runtime is available in this dev environment, so these run
# against H2 in MySQL compatibility mode instead of real MySQL -- see build.gradle's
# testRuntimeOnly("com.h2database:h2") comment for why.
spring.datasource.url=jdbc:h2:mem:conference_cms_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Skips data.sql -- it uses MySQL session-variable syntax and production seed data has no
# place in integration tests, which build their own fixtures per test.
spring.sql.init.mode=never

app.secrets.encryption-key=nB3qggZvsjFbrMlu/rIurwWEuHBS1Xhi8Sq/LZRcOEA=
app.bootstrap.admin-email=admin@example.com

spring.mail.host=localhost
spring.mail.port=1025

logging.level.org.confcms.cms=WARN
logging.level.org.springframework.security=WARN
